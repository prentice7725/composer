name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install test and GUI dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
