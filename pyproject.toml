[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portrait-composer"
version = "0.3.0.dev0"
description = "Semantic Portrait Assembly & Authoring Tool (C6 GUI)"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]
gui = ["PySide6>=6.6"]

[project.scripts]
portrait-composer = "portrait_composer.cli:main"
portrait-composer-gui = "portrait_composer.gui:main"

[tool.setuptools.packages.find]
include = ["portrait_composer*"]
